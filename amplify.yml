# AWS Amplify Hosting — 정적 사이트 (빌드 없음)
version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: /
    files:
      - index.html
      - css/**/*
      - js/**/*
      - photo.jpg
      - robots.txt
      - sitemap.xml
      - favicon.ico
      - assets/**/*
  cache:
    paths: []
